[package]
name = "rigagent"
version = "0.1.0"
edition = "2024"
description = "Autonomous retail replenishment workflow demo built with Rig."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
diesel = { version = "2.2", default-features = false, features = [
    "chrono",
    "r2d2",
    "sqlite",
] }
diesel_migrations = { version = "2.2", default-features = false, features = [
    "sqlite",
] }
dotenvy = "0.15"
rig = { package = "rig-core", version = "0.38.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
